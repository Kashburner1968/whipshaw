name: Validate transparency data
on:
  push:
    paths:
      - 'manifest.json'
      - 'schema.json'
      - 'bot_rules.json'
      - 'market_structure_feed.py'
      - 'data/**'
      - '.github/workflows/validate-transparency.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - 'schema.json'
      - 'bot_rules.json'
      - 'market_structure_feed.py'
      - 'data/**'
      - '.github/workflows/validate-transparency.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate machine-readable data
        run: |
          python -m json.tool manifest.json > /dev/null
          python -m json.tool schema.json > /dev/null
          python -m json.tool bot_rules.json > /dev/null
          python market_structure_feed.py > /tmp/feed.json
          python -m json.tool /tmp/feed.json > /dev/null
