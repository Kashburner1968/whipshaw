name: Faultline Financial IndexNow

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.json'
      - '*.md'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Submit latest Faultline URLs to IndexNow
        shell: bash
        run: |
          cat > payload.json <<'EOF'
          {
            "host": "kashburner1968.github.io",
            "key": "9f4a7c2e6d1b4f8a9c3e7d5b2a6f1c8e",
            "keyLocation": "https://kashburner1968.github.io/whipshaw/9f4a7c2e6d1b4f8a9c3e7d5b2a6f1c8e.txt",
            "urlList": [
              "https://kashburner1968.github.io/whipshaw/",
              "https://kashburner1968.github.io/whipshaw/morning-market-fire-alarm-2026-09-03.html",
              "https://kashburner1968.github.io/whipshaw/consumer-strangulation-vector.html",
              "https://kashburner1968.github.io/whipshaw/machine-slave-faultline-financial.html",
              "https://kashburner1968.github.io/whipshaw/faultline-latest.json",
              "https://kashburner1968.github.io/whipshaw/sitemap.xml"
            ]
          }
          EOF

          echo "Submitting changed Faultline Financial URLs to IndexNow..."
          HTTP_CODE=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @payload.json)

          echo "IndexNow HTTP status: $HTTP_CODE"
          cat response.txt || true

          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "202" ]]; then
            echo "IndexNow did not confirm the submission. The GitHub Pages endpoint and key location must be publicly reachable for verification."
            exit 1
          fi
